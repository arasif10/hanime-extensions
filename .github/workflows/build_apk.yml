name: Build Extension APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  ALIAS: ${{ secrets.ALIAS }}
  EXTENSIONS_REPO_TOKEN: ${{ secrets.EXTENSIONS_REPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore signing keystore
        run: |
          if [ -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "::error::SIGNING_KEY secret is missing or empty; cannot sign release APKs"
            exit 1
          fi
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signingkey.jks
          test -s signingkey.jks || {
            echo "::error::Decoded signingkey.jks is empty; check the SIGNING_KEY secret"
            exit 1
          }
          ls -la signingkey.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-apk
          path: '**/build/outputs/apk/**/*.apk'

  publish:
    # Publish the freshly built APKs to the public arasif10/hanime-extensions repo so
    # AniZen users can update. Needs EXTENSIONS_REPO_TOKEN (a PAT with write
    # access to arasif10/hanime-extensions) stored in this repo's secrets. Steps are
    # gated on it so the job no-ops (skipped) until the secret is configured -
    # job-level "if" cannot reference secrets, so it is exposed via env instead.
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        if: ${{ env.EXTENSIONS_REPO_TOKEN != '' }}

      - name: Download built APKs
        uses: actions/download-artifact@v4
        if: ${{ env.EXTENSIONS_REPO_TOKEN != '' }}
        with:
          name: extension-apk
          path: apks

      - name: Clone extensions repo
        if: ${{ env.EXTENSIONS_REPO_TOKEN != '' }}
        run: |
          git clone --quiet --branch repo \
            "https://x-access-token:${EXTENSIONS_REPO_TOKEN}@github.com/arasif10/hanime-extensions.git" \
            extensions-repo

      - name: Collect extension icons
        if: ${{ env.EXTENSIONS_REPO_TOKEN != '' }}
        run: |
          mkdir -p icons
          for dir in src/all/*/; do
            ext=$(basename "$dir")
            icon="$dir/res/mipmap-xxxhdpi/ic_launcher.png"
            if [ -f "$icon" ]; then
              cp "$icon" "icons/all.$ext.png"
            fi
          done
          ls -la icons

      - name: Publish APKs and update index
        if: ${{ env.EXTENSIONS_REPO_TOKEN != '' }}
        run: python .github/publish_extensions.py --apk-dir apks --extensions-repo extensions-repo --icons-dir icons
